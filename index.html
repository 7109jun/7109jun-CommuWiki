<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CommuWiki Snapshot</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:"Segoe UI",Tahoma,sans-serif;color:#111;background:#fff}
body{display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit}
button{border:1px solid #aaa;background:#f7f7f7;color:#111;padding:4px 10px;cursor:pointer}
button:hover{background:#e9e9e9}
button:active{background:#ddd}
#menu{height:30px;display:flex;align-items:center;border-bottom:1px solid #aaa;background:#f3f3f3}
.menuItem{height:29px;padding:5px 12px;cursor:pointer}
.menuItem:hover{background:#ddd}
#toolbar{height:43px;display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #aaa;background:#fafafa}
#title{width:230px;height:29px;border:1px solid #aaa;padding:4px 7px}
#toolbar .spacer{flex:1}
#layout{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 275px}
#work{min-width:0;display:flex;flex-direction:column;border-right:1px solid #aaa}
#tabs{height:34px;display:flex;align-items:stretch;border-bottom:1px solid #aaa;background:#f5f5f5}
.tab{border:0;border-right:1px solid #bbb;background:#eee;padding:6px 15px}
.tab.active{background:#fff;border-bottom:2px solid #333}
#editorArea{position:relative;min-height:0;flex:1}
#editor,#preview,#diff{position:absolute;inset:0;margin:0;padding:14px 16px;overflow:auto}
#editor{width:100%;height:100%;border:0;outline:0;resize:none;background:#fff;color:#111;font:15px/1.55 Consolas,"Cascadia Mono","Courier New",monospace;tab-size:4}
#preview{display:none;background:#fff;line-height:1.55}
#diff{display:none;background:#fff;font:13px/1.45 Consolas,"Cascadia Mono","Courier New",monospace;white-space:pre-wrap}
.md-h1{font-size:27px}.md-h2{font-size:22px}.md-h3{font-size:18px}
#preview h1,#preview h2,#preview h3{border-bottom:1px solid #ddd;padding-bottom:4px}
#preview blockquote{margin:8px 0;padding:5px 12px;border-left:4px solid #999;background:#f5f5f5}
#preview pre{padding:10px;background:#f3f3f3;border:1px solid #ccc;overflow:auto}
#preview code{font-family:Consolas,"Cascadia Mono","Courier New",monospace;background:#f1f1f1;padding:1px 3px}
#preview pre code{background:none;padding:0}
#preview table{border-collapse:collapse;margin:8px 0}
#preview th,#preview td{border:1px solid #aaa;padding:5px 9px}
#preview img{max-width:100%}
#preview a{color:#0645ad}
#side{min-width:0;display:flex;flex-direction:column;background:#fafafa}
.sideHead{height:34px;padding:7px 9px;border-bottom:1px solid #aaa;font-weight:600;background:#eee}
#history{min-height:0;flex:1;overflow:auto}
.hist{padding:8px 9px;border-bottom:1px solid #ddd;cursor:pointer}
.hist:hover{background:#e7e7e7}
.histTitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histMeta{font-size:11px;color:#555;margin-top:2px}
#docs{max-height:35%;overflow:auto;border-top:1px solid #aaa}
.doc{padding:7px 9px;border-bottom:1px solid #ddd;cursor:pointer}
.doc:hover{background:#e7e7e7}
#status{height:24px;border-top:1px solid #aaa;background:#eee;display:flex;align-items:center;padding:0 8px;font-size:12px;color:#333;gap:15px}
#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center}
.modal{width:min(620px,calc(100vw - 30px));background:#fff;border:1px solid #666;box-shadow:0 5px 20px #555;padding:15px}
.modal h3{margin:0 0 10px}
.modal textarea,.modal input{width:100%;border:1px solid #aaa;padding:7px}
.modal textarea{height:150px;font:13px Consolas,monospace}
.modalFoot{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.small{font-size:12px;color:#555}
.ok{color:#075f07}.bad{color:#a00}
@media(max-width:800px){#layout{grid-template-columns:1fr}#side{display:none}#title{width:150px}}
</style>
</head>
<body>
<div id="menu">
  <div class="menuItem" data-menu="file">File</div>
  <div class="menuItem" data-menu="edit">Edit</div>
  <div class="menuItem" data-menu="view">View</div>
  <div class="menuItem" data-menu="tools">Tools</div>
</div>
<div id="toolbar">
  <input id="title" value="Untitled Snapshot" aria-label="Title">
  <button id="saveBtn">Save Snapshot</button>
  <button id="previewBtn">Preview</button>
  <button id="codeBtn">Code</button>
  <button id="diffBtn">Diff</button>
  <button id="shareBtn">Share</button>
  <span class="spacer"></span>
  <button id="newBtn">New</button>
</div>
<div id="layout">
  <section id="work">
    <div id="tabs">
      <button class="tab active" id="codeTab">Code</button>
      <button class="tab" id="previewTab">Preview</button>
      <button class="tab" id="diffTab">Diff</button>
    </div>
    <div id="editorArea">
      <textarea id="editor" spellcheck="false" placeholder="# Markdown&#10;&#10;Write Markdown here."></textarea>
      <div id="preview"></div>
      <div id="diff"></div>
    </div>
  </section>
  <aside id="side">
    <div class="sideHead">Snapshot History</div>
    <div id="history"></div>
    <div class="sideHead">Local Documents</div>
    <div id="docs"></div>
  </aside>
</div>
<div id="status">
  <span id="state">Ready</span>
  <span id="counts">0 chars</span>
  <span>SNAPSHOT</span>
</div>

<div id="modalBack">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modalFoot" id="modalFoot"></div>
  </div>
</div>

<script>
"use strict";

const KEY = "commuwiki-snapshot-v4";
const DRAFT_KEY = KEY + ":draft";
const HISTORY_KEY = KEY + ":history";
const DOCS_KEY = KEY + ":docs";
const MAX_HISTORY = 100;
const MAX_DOCS = 40;

const $ = id => document.getElementById(id);
const editor = $("editor");
const title = $("title");
let mode = "code";
let dirty = false;
let currentSnapshot = null;
let undoStack = [];
let redoStack = [];
let lastEditValue = "";
let lastEditTitle = "";

function readJSON(k, fallback){
  try { return JSON.parse(localStorage.getItem(k) || ""); }
  catch(e){ return fallback; }
}
function writeJSON(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+"-"+Math.random().toString(36).slice(2));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function inlineMD(s){
  s=escapeHtml(s);
  s=s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,'<img alt="$1" src="$2">');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s=s.replace(/_([^_]+)_/g,'<em>$1</em>');
  return s;
}
function markdownToHTML(src){
  const lines=src.replace(/\r\n?/g,"\n").split("\n");
  let out=[], i=0, inCode=false, code=[];
  while(i<lines.length){
    let l=lines[i];
    if(l.startsWith("```")){
      if(!inCode){inCode=true;code=[]}
      else{out.push("<pre><code>"+escapeHtml(code.join("\n"))+"</code></pre>");inCode=false}
      i++; continue;
    }
    if(inCode){code.push(l);i++;continue}
    if(/^#{1,6}\s+/.test(l)){
      const m=l.match(/^(#{1,6})\s+(.*)$/);
      const n=m[1].length;
      out.push("<h"+n+">"+inlineMD(m[2])+"</h"+n+">");i++;continue;
    }
    if(/^>\s?/.test(l)){
      let a=[]; while(i<lines.length && /^>\s?/.test(lines[i])){a.push(lines[i].replace(/^>\s?/,""));i++}
      out.push("<blockquote>"+a.map(inlineMD).join("<br>")+"</blockquote>");continue;
    }
    if(/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*[-*+]\s+/.test(l)){
      let a=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){a.push(lines[i].replace(/^\s*[-*+]\s+/,""));i++}
      out.push("<ul>"+a.map(x=>"<li>"+inlineMD(x.replace(/^\[( |x|X)\]\s*/,""))+"</li>").join("")+"</ul>");continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      let a=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){a.push(lines[i].replace(/^\s*\d+\.\s+/,""));i++}
      out.push("<ol>"+a.map(x=>"<li>"+inlineMD(x)+"</li>").join("")+"</ol>");continue;
    }
    if(l.includes("|") && i+1<lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i+1])){
      const split=x=>x.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(y=>y.trim());
      const heads=split(l), rows=[];i+=2;
      while(i<lines.length&&lines[i].includes("|")){rows.push(split(lines[i]));i++}
      out.push("<table><thead><tr>"+heads.map(x=>"<th>"+inlineMD(x)+"</th>").join("")+"</tr></thead><tbody>"+
        rows.map(r=>"<tr>"+heads.map((_,j)=>"<td>"+inlineMD(r[j]||"")+"</td>").join("")+"</tr>").join("")+"</tbody></table>");continue;
    }
    if(l.trim()===""){i++;continue}
    let p=[l];i++;
    while(i<lines.length && lines[i].trim()!=="" && !/^(#{1,6})\s+|^>\s?|^\s*[-*+]\s+|^\s*\d+\.\s+|^```/.test(lines[i])){
      p.push(lines[i]);i++;
    }
    out.push("<p>"+p.map(inlineMD).join("<br>")+"</p>");
  }
  if(inCode) out.push("<pre><code>"+escapeHtml(code.join("\n"))+"</code></pre>");
  return out.join("\n");
}

function updateStatus(){
  $("counts").textContent = editor.value.length+" chars • "+editor.value.split(/\n/).length+" lines";
  $("state").textContent = dirty ? "Modified" : "Saved";
  $("state").className = dirty ? "bad" : "ok";
}
function setMode(m){
  mode=m;
  $("editor").style.display=m==="code"?"block":"none";
  $("preview").style.display=m==="preview"?"block":"none";
  $("diff").style.display=m==="diff"?"block":"none";
  [$("codeTab"),$("previewTab"),$("diffTab")].forEach(x=>x.classList.remove("active"));
  $(m+"Tab").classList.add("active");
  if(m==="preview") $("preview").innerHTML=markdownToHTML(editor.value);
  if(m==="diff") renderDiff();
}
function pushUndo(){
  const s={title:title.value,content:editor.value};
  const prev=undoStack[undoStack.length-1];
  if(!prev || prev.content!==s.content || prev.title!==s.title) undoStack.push(s);
  if(undoStack.length>100) undoStack.shift();
  redoStack=[];
}
function restoreState(s){
  title.value=s.title;editor.value=s.content;dirty=true;updateStatus();
}
function undo(){
  if(undoStack.length<2)return;
  const now=undoStack.pop();redoStack.push(now);
  restoreState(undoStack[undoStack.length-1]);
}
function redo(){
  if(!redoStack.length)return;
  const s=redoStack.pop();undoStack.push(s);restoreState(s);
}
function getHistory(){return readJSON(HISTORY_KEY,[])}
function setHistory(h){writeJSON(HISTORY_KEY,h.slice(-MAX_HISTORY))}
function snapshotObject(source="manual"){
  return {id:uid(),title:title.value.trim()||"Untitled Snapshot",content:editor.value,
    created:Date.now(),source};
}
function sameSnapshot(a,b){return a && b && a.title===b.title && a.content===b.content}
function saveSnapshot(source="manual"){
  const snap=snapshotObject(source);
  let h=getHistory();
  if(!sameSnapshot(h[h.length-1],snap)) h.push(snap);
  setHistory(h);
  currentSnapshot=snap;
  dirty=false;
  saveDraft();
  renderHistory();
  updateStatus();
}
function saveDraft(){
  writeJSON(DRAFT_KEY,{title:title.value,content:editor.value,updated:Date.now()});
}
function loadSnapshot(s){
  title.value=s.title;editor.value=s.content;
  currentSnapshot=s;dirty=false;
  undoStack=[{title:s.title,content:s.content}];redoStack=[];
  saveDraft();setMode("code");updateStatus();
}
function renderHistory(){
  const box=$("history");box.innerHTML="";
  const h=getHistory().slice().reverse();
  if(!h.length){box.innerHTML='<div class="small" style="padding:10px">No snapshots yet.</div>';return}
  h.forEach(s=>{
    const d=document.createElement("div");d.className="hist";
    d.innerHTML='<div class="histTitle"></div><div class="histMeta"></div>';
    d.querySelector(".histTitle").textContent=s.title;
    d.querySelector(".histMeta").textContent=new Date(s.created).toLocaleString()+" • "+s.source;
    d.onclick=()=>loadSnapshot(s);
    box.appendChild(d);
  });
}
function getDocs(){return readJSON(DOCS_KEY,[])}
function renderDocs(){
  const box=$("docs");box.innerHTML="";
  const docs=getDocs().slice().reverse();
  if(!docs.length){box.innerHTML='<div class="small" style="padding:10px">No local documents.</div>';return}
  docs.forEach(s=>{
    const d=document.createElement("div");d.className="doc";
    d.textContent=s.title;
    d.onclick=()=>loadSnapshot(s);
    box.appendChild(d);
  });
}
function saveLocalDoc(){
  let docs=getDocs();
  const obj=snapshotObject("local");
  const old=docs.findIndex(x=>x.id===stateLocalId);
  if(old>=0) docs[old]=obj; else docs.push(obj);
  stateLocalId=obj.id;
  writeJSON(DOCS_KEY,docs.slice(-MAX_DOCS));renderDocs();
  saveSnapshot("local");
}
let stateLocalId=null;

function bytesToB64(bytes){
  let bin="";const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(bin);
}
function b64ToBytes(s){
  const bin=atob(s);const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;
}
function b64url(s){return s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function fromB64url(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return s}
function utf8b64(s){return b64url(bytesToB64(new TextEncoder().encode(s)))}
function b64utf8(s){return new TextDecoder().decode(b64ToBytes(fromB64url(s)))}

async function compressString(s){
  if("CompressionStream" in window){
    const cs=new CompressionStream("deflate-raw"),w=cs.writable.getWriter();
    w.write(new TextEncoder().encode(s));w.close();
    const buf=await new Response(cs.readable).arrayBuffer();
    return "z"+b64url(bytesToB64(new Uint8Array(buf)));
  }
  return "t"+utf8b64(s);
}
async function decompressString(token){
  if(token.startsWith("t"))return b64utf8(token.slice(1));
  if(token.startsWith("z") && "DecompressionStream" in window){
    const raw=b64ToBytes(fromB64url(token.slice(1)));
    const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();
    w.write(raw);w.close();
    return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  }
  throw new Error("This browser cannot decompress this snapshot.");
}
function basePath(){
  const u=new URL(location.href);u.hash="";u.search="";return u.href;
}
async function makeShare(){
  const payload={v:4,t:title.value||"Untitled Snapshot",c:editor.value,created:Date.now()};
  const token=await compressString(JSON.stringify(payload));
  return basePath()+"#cw="+token;
}
async function importURL(){
  if(!location.hash.startsWith("#cw="))return false;
  try{
    const raw=await decompressString(location.hash.slice(4));
    const p=JSON.parse(raw);
    if(!p || p.v!==4)throw new Error("Unsupported snapshot version");
    title.value=p.t||"Untitled Snapshot";editor.value=p.c||"";
    const imported={id:uid(),title:title.value,content:editor.value,created:p.created||Date.now(),source:"shared URL"};
    currentSnapshot=imported;dirty=false;
    let h=getHistory();if(!sameSnapshot(h[h.length-1],imported))h.push(imported);setHistory(h);
    undoStack=[{title:title.value,content:editor.value}];redoStack=[];
    saveDraft();renderHistory();setMode("code");updateStatus();
    return true;
  }catch(e){alert("공유 스냅샷을 열 수 없습니다.\n"+e.message);return false}
}
async function share(){
  saveSnapshot("shared");
  const url=await makeShare();
  if(url.length>12000) alert("URL이 매우 깁니다. Markdown 내용을 줄이면 더 안정적으로 공유할 수 있습니다.");
  showModal("Share Snapshot",
    '<div class="small">이 링크 자체가 스냅샷입니다. 서버나 DB 없이 URL에 내용이 들어갑니다.</div><textarea id="shareText" readonly></textarea>',
    [{text:"Copy",fn:async()=>{await navigator.clipboard.writeText(url);alert("공유 링크를 복사했습니다.");}},{text:"Open",fn:()=>location.href=url},{text:"Close"}]);
  $("shareText").value=url;
}
function diffLines(a,b){
  const A=a.replace(/\r\n?/g,"\n").split("\n"),B=b.replace(/\r\n?/g,"\n").split("\n");
  const n=A.length,m=B.length,dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out=[];
  while(i<n&&j<m){
    if(A[i]===B[j]){out.push("  "+A[i]);i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push("- "+A[i]);i++}
    else{out.push("+ "+B[j]);j++}
  }
  while(i<n)out.push("- "+A[i++]);
  while(j<m)out.push("+ "+B[j++]);
  return out.join("\n");
}
function renderDiff(){
  const h=getHistory();const base=currentSnapshot||h[h.length-1];
  $("diff").textContent=base ? diffLines(base.content,editor.value) : editor.value;
}
function showModal(t,body,buttons){
  $("modalTitle").textContent=t;$("modalBody").innerHTML=body;
  const f=$("modalFoot");f.innerHTML="";
  buttons.forEach(b=>{const x=document.createElement("button");x.textContent=b.text;x.onclick=()=>{if(b.fn)b.fn();$("modalBack").style.display="none"};f.appendChild(x)});
  $("modalBack").style.display="flex";
}
function newSnapshot(){
  if(dirty && !confirm("저장하지 않은 변경사항이 있습니다. 새 스냅샷을 만들까요?"))return;
  title.value="Untitled Snapshot";editor.value="# New Snapshot\n\n";
  currentSnapshot=null;dirty=true;undoStack=[{title:title.value,content:editor.value}];redoStack=[];
  setMode("code");updateStatus();
}
function importMarkdown(){
  showModal("Import Markdown",'<textarea id="importText" placeholder="Paste Markdown here"></textarea>',
    [{text:"Import",fn:()=>{editor.value=$("importText").value;dirty=true;pushUndo();setMode("code");updateStatus();}},{text:"Cancel"}]);
}
function exportMarkdown(){
  const blob=new Blob([editor.value],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(title.value.trim()||"snapshot")+".md";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function printPreview(){
  const w=window.open("","_blank");
  if(!w)return;
  w.document.write("<!doctype html><html><head><title>"+escapeHtml(title.value)+"</title><style>body{font-family:Segoe UI,sans-serif;max-width:900px;margin:40px auto;line-height:1.6}pre{background:#eee;padding:12px}code{font-family:Consolas}</style></head><body><h1>"+escapeHtml(title.value)+"</h1>"+markdownToHTML(editor.value)+"</body></html>");
  w.document.close();w.focus();w.print();
}
document.querySelectorAll(".menuItem").forEach(x=>x.onclick=()=>{
  const m=x.dataset.menu;
  if(m==="file")showModal("File","",[{text:"Import Markdown",fn:importMarkdown},{text:"Export Markdown",fn:exportMarkdown},{text:"Print / PDF",fn:printPreview},{text:"Cancel"}]);
  if(m==="edit")showModal("Edit","",[{text:"Undo",fn:undo},{text:"Redo",fn:redo},{text:"Cancel"}]);
  if(m==="view")showModal("View","",[{text:"Code",fn:()=>setMode("code")},{text:"Preview",fn:()=>setMode("preview")},{text:"Diff",fn:()=>setMode("diff")},{text:"Cancel"}]);
  if(m==="tools")showModal("Tools","<div>CommuWiki is a static snapshot wiki. Browser history is stored locally in this browser.</div>",
    [{text:"Clear Local History",fn:()=>{if(confirm("이 브라우저의 스냅샷 기록을 모두 삭제할까요?")){localStorage.removeItem(HISTORY_KEY);localStorage.removeItem(DOCS_KEY);renderHistory();renderDocs();}}},{text:"Cancel"}]);
});
$("saveBtn").onclick=()=>saveSnapshot("manual");
$("previewBtn").onclick=()=>setMode("preview");
$("codeBtn").onclick=()=>setMode("code");
$("diffBtn").onclick=()=>setMode("diff");
$("shareBtn").onclick=share;
$("newBtn").onclick=newSnapshot;
$("codeTab").onclick=()=>setMode("code");
$("previewTab").onclick=()=>setMode("preview");
$("diffTab").onclick=()=>setMode("diff");

editor.addEventListener("input",()=>{
  dirty=true;
  const cur={title:title.value,content:editor.value};
  const last=undoStack[undoStack.length-1];
  if(!last || last.content!==cur.content || last.title!==cur.title)undoStack.push(cur);
  if(undoStack.length>100)undoStack.shift();
  redoStack=[];
  saveDraft();updateStatus();
});
title.addEventListener("input",()=>{
  dirty=true;
  const cur={title:title.value,content:editor.value};
  const last=undoStack[undoStack.length-1];
  if(!last || last.content!==cur.content || last.title!==cur.title)undoStack.push(cur);
  saveDraft();updateStatus();
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveSnapshot("manual")}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redo()}
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();setMode("preview")}
});
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

(async function init(){
  const shared=await importURL();
  if(!shared){
    const draft=readJSON(DRAFT_KEY,null);
    const h=getHistory();
    if(draft && !h.length){title.value=draft.title||"Untitled Snapshot";editor.value=draft.content||""}
    else if(h.length)loadSnapshot(h[h.length-1]);
    else{
      title.value="Untitled Snapshot";editor.value="# Welcome to CommuWiki\n\nWrite Markdown here.\n";
      undoStack=[{title:title.value,content:editor.value}];
      saveSnapshot("initial");
    }
  }
  renderHistory();renderDocs();updateStatus();
})();
</script>
